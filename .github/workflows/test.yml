name: LibMultiplayer

on:
  push:
  pull_request:

jobs:
  test:
    name: Lua 5.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Keep tests in the package
        run: sed -i '/^ignore:/,$d' .pkgmeta
      - uses: BigWigsMods/packager@v2
        with:
          args: -d
      - name: Test the package
        run: |
          set -euo pipefail
          zipfile=$(find .release -maxdepth 1 -type f -name '*.zip' ! -name '*nolib*' -print -quit)
          test -n "$zipfile"
          rm -rf "${RUNNER_TEMP}/pkg"
          unzip -q "$zipfile" -d "${RUNNER_TEMP}/pkg"
          cd "${RUNNER_TEMP}/pkg/LibMultiplayer"
          FAIL_ON_MISSING_SNAPSHOTS=1 TEST_WORKERS=$(nproc --all) lua5.1 Libs/LibUnitWow/run.lua
