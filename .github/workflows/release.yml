name: Package and release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Annotated tags become the package version.
      - uses: BigWigsMods/packager@v2
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
